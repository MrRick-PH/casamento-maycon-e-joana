<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Confirmação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Registro de Confirmação</h1>
        <form id="rsvp-form">
            <div class="form-group">
                <label for="nome">Nome do Convidado:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="presente">Seleção de Presente:</label>
                <select id="presente" name="presente" required>
                    <option value="" disabled selected>Selecione um item</option>
                    <option value="Faqueiro">Faqueiro</option>
                    <option value="Jogo de Panelas">Jogo de Panelas</option>
                    <option value="Conjunto de Taças">Conjunto de Taças</option>
                    <option value="Liquidificador">Liquidificador</option>
                    <option value="Jogo de Cama">Jogo de Cama</option>
                </select>
            </div>
            <button type="submit">Submeter Dados</button>
            <div id="status"></div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
