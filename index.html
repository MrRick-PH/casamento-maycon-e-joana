<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Confirmação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Casamento de Maycon e Joana</h2>
        <h1>Confirme sua Presença</h1>
        <form id="rsvp-form">
            <div class="form-group">
                <label for="nome">Nome do Convidado:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="presente">Seleção de Presente:</label>
                <select id="presente" name="presente" required>
                    <option value="" disabled selected>Estabelecendo conexão com o servidor...</option>
                </select>
            </div>
            <button type="submit" id="submit-btn" disabled>Aguardando Inicialização</button>
            <div id="status"></div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
